name: Publish astralix-tl to PyPI

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: pypi-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.12.17"
      - run: uv build
      - run: uv tool run twine check dist/*
      - run: uv venv --python 3.12 .venv
      - run: uv pip install --python .venv/bin/python dist/*.whl aiohttp
      - run: .venv/bin/python -I -m unittest discover -s tests -v
      - run: .venv/bin/python -I -O -m unittest discover -s tests -v
      - name: Check release tag against package version
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          .venv/bin/python -I - <<'PY'
          import os
          from importlib.metadata import version
          assert os.environ["RELEASE_TAG"] == "v" + version("astralix-tl")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/astralix-tl/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
